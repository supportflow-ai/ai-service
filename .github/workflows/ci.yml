name: AI Service CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Phát hành image SHA lên GHCR sau khi toàn bộ kiểm tra đạt'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements-runtime.lock -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Contract validation
        run: python scripts/validate_ai_contract.py

      - name: Tests
        run: pytest

      - name: Baseline smoke evaluation
        run: python -m evaluation.run_classification

      - name: Python compile check
        run: python -m compileall -q src evaluation scripts

      - name: Verify canonical backend contract bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.request

          lock = json.load(open("contract.lock.json", encoding="utf-8"))
          url = (
              f"https://raw.githubusercontent.com/"
              f"{lock['sourceRepository']}/{lock['sourceRef']}/{lock['path']}"
          )
          content = urllib.request.urlopen(url, timeout=30).read()
          assert hashlib.sha256(content).hexdigest() == lock["sha256"]
          PY

  docker:
    runs-on: ubuntu-latest
    needs: quality
    env:
      AI_IMAGE: ghcr.io/supportflow-ai/ai-service:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Đóng gói image runtime
        run: docker build -t "$AI_IMAGE" .
      - name: Xác minh HTTP trong container
        shell: bash
        run: |
          set -euo pipefail
          export SUPPORTFLOW_AI_SERVICE_TOKEN
          SUPPORTFLOW_AI_SERVICE_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          container_id=
          cleanup() {
            if [[ -n "$container_id" ]]; then
              docker rm -f "$container_id" >/dev/null
            fi
          }
          trap cleanup EXIT

          echo "Commit: $(git rev-parse HEAD)"
          echo "Image: $AI_IMAGE"
          docker image inspect --format 'Image ID: {{.Id}}' "$AI_IMAGE"
          for provider in rule noop; do
            container_id="$(docker run -d --network none \
              -e SUPPORTFLOW_AI_ENVIRONMENT=production \
              -e SUPPORTFLOW_AI_SERVICE_TOKEN \
              -e SUPPORTFLOW_AI_CLASSIFIER_PROVIDER="$provider" \
              -e SUPPORTFLOW_AI_MAX_REQUEST_BYTES=65536 \
              "$AI_IMAGE")"
            docker exec -i "$container_id" python - < scripts/smoke_http.py
            cleanup
            container_id=
          done
      - name: Kiểm chứng embedding thật qua HTTP
        env:
          SUPPORTFLOW_AI_SERVICE_TOKEN: synthetic-ci-knowledge-token-at-least-32-characters
        run: |
          docker run -d --name knowledge-smoke -p 127.0.0.1:8000:8000 \
            -e SUPPORTFLOW_AI_SERVICE_TOKEN \
            -e SUPPORTFLOW_AI_CLASSIFIER_PROVIDER=rule \
            -e SUPPORTFLOW_AI_EMBEDDING_PROVIDER=local-e5 \
            "$AI_IMAGE"
          python scripts/smoke_knowledge_index.py
      - name: Dọn container kiểm chứng
        if: always()
        run: docker rm -f knowledge-smoke || true

  publish:
    name: Phát hành image bất biến
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.repository_owner == 'supportflow-ai' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ai-service
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build và push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/supportflow-ai/${{ matrix.image }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Ghi bằng chứng digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Thiếu digest hợp lệ; không tạo bằng chứng phát hành.")
          image = os.environ["IMAGE"]
          output = pathlib.Path("artifacts") / (image + ".json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({
              "repository": os.environ["SOURCE_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "images": {image: "ghcr.io/supportflow-ai/" + image + "@" + digest}
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ghcr-${{ matrix.image }}-${{ github.sha }}
          path: artifacts/*.json
